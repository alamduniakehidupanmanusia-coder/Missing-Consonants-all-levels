<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missing Consonants</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fc;--card:#fff;--ink:#14213d;--mut:#5b6785;--blue:#2557d6;--blue2:#e3ebfd;--yel:#ffc933;--grn:#17884b;--grn2:#dcf5e6;--red:#c93a40;--red2:#fde4e5;--line:#d5ddf0;--side:#14213d;--sidei:#dbe4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#18213a;--ink:#eef2ff;--mut:#9aa7c9;--blue:#7ea2ff;--blue2:#23325c;--grn:#5fd691;--grn2:#17382a;--red:#ff8a8f;--red2:#401d22;--line:#2b3759;--side:#0a0f1d}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#18213a;--ink:#eef2ff;--mut:#9aa7c9;--blue:#7ea2ff;--blue2:#23325c;--grn:#5fd691;--grn2:#17382a;--red:#ff8a8f;--red2:#401d22;--line:#2b3759;--side:#0a0f1d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3,.tile,.brand{font-family:"Baloo 2",Nunito,system-ui,sans-serif;margin:0}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--side);color:var(--sidei);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{font-size:21px;font-weight:800;color:#fff;padding:4px 10px 2px;line-height:1.1}.brand b{color:var(--yel)}
.tag{font-size:12px;padding:0 10px 14px;color:#9fb0e6}
nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--sidei);font-weight:700}
nav button:hover{background:#ffffff14}nav button.on{background:var(--yel);color:#14213d}
nav button:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.by{margin-top:auto;font-size:12px;color:#9fb0e6;padding:10px}
main{padding:28px;max-width:960px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat b{display:block;font:800 28px "Baloo 2";color:var(--blue)}.stat span{color:var(--mut);font-size:14px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;text-align:center;min-height:44px}
.btn.alt{background:var(--blue2);color:var(--blue)}.btn.y{background:var(--yel);color:#14213d}.btn[disabled]{opacity:.5;cursor:default}
.lv{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.lv small{color:var(--mut);display:block;font-weight:500}
.word{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.tile{width:52px;height:62px;border-radius:10px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-size:32px;font-weight:800;border-bottom:5px solid var(--blue);text-transform:uppercase}
input.tile{border:3px dashed var(--yel);border-bottom-width:5px;background:var(--card);color:var(--ink);text-align:center;padding:0;font-size:32px}
.tile.blank{background:var(--card);border:3px dashed var(--yel);border-bottom-width:5px;color:var(--mut)}
.tile.ok{background:var(--grn2);color:var(--grn);border-color:var(--grn)}.tile.no{background:var(--red2);color:var(--red);border-color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.opts .btn{font:800 26px "Baloo 2";text-transform:uppercase}
.bar{height:10px;background:var(--blue2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.fb{padding:12px 14px;border-radius:10px;margin-top:12px;font-weight:700}.fb.ok{background:var(--grn2);color:var(--grn)}.fb.no{background:var(--red2);color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--yel);color:#14213d;font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.badge{opacity:.45}.badge.got{opacity:1;border-color:var(--yel)}
.hdr{display:none}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:column}
nav{display:none;flex-direction:column}nav.open{display:flex}.hdr{display:block;margin:6px 10px;width:auto}main{padding:16px}.tile{width:42px;height:54px;font-size:26px}}
@media(prefers-reduced-motion:no-preference){.pop{animation:p .25s}@keyframes p{from{transform:scale(.8)}}}
</style></head><body>
<div id="app"><aside><div class="brand">Missing <b>Consonants</b></div><div class="tag">Complete the Word, Unlock Your English!</div>
<button class="btn alt hdr" onclick="document.getElementById('nv').classList.toggle('open')">Menu</button>
<nav id="nv" aria-label="Main"></nav><div class="by">Created by Ahmad Budi Leksono</div></aside><main id="m"></main></div>
<script>
const LV=[["Starter","3-letter words · 1 missing · pick a letter",1],["Beginner","4-letter words · 1 missing · pick a letter",1],["Elementary","5-letter words · 1–2 missing · type",2],["Pre-Intermediate","6-letter words · 2 missing · type",2],["Intermediate","7–8 letter words · 2–3 missing · type",3],["Advanced","9+ letter words · 3–4 missing · type",4]];
const RAW=["cat:kucing,dog:anjing,sun:matahari,pen:pena,bus:bus,hat:topi,cup:cangkir,bed:tempat tidur,pig:babi,box:kotak,car:mobil,map:peta,key:kunci,bag:tas,fan:kipas,net:jaring,leg:kaki,jam:selai",
"book:buku,desk:meja belajar,fish:ikan,milk:susu,bird:burung,tree:pohon,door:pintu,lamp:lampu,ball:bola,farm:ladang,rain:hujan,star:bintang,moon:bulan,bear:beruang,king:raja,song:lagu,road:jalan,hand:tangan,gift:hadiah,cake:kue",
"apple:apel,chair:kursi,horse:kuda,house:rumah,water:air,table:meja,plant:tanaman,green:hijau,bread:roti,clock:jam,lemon:lemon,mouse:tikus,sheep:domba,train:kereta,tiger:harimau,snake:ular,pizza:pizza,stone:batu,truck:truk,glass:gelas",
"school:sekolah,friend:teman,orange:jeruk,garden:kebun,window:jendela,pencil:pensil,monkey:monyet,rabbit:kelinci,pocket:saku,winter:musim dingin,doctor:dokter,flower:bunga,bridge:jembatan,planet:planet,island:pulau,bottle:botol,jungle:hutan,castle:kastil,dinner:makan malam,market:pasar",
"teacher:guru,kitchen:dapur,library:perpustakaan,penguin:penguin,blanket:selimut,chicken:ayam,journey:perjalanan,holiday:liburan,mountain:gunung,hospital:rumah sakit,umbrella:payung,giraffe:jerapah,dolphin:lumba-lumba,curtain:tirai,tractor:traktor,teacher:guru,machine:mesin,balcony:balkon,package:paket,station:stasiun",
"butterfly:kupu-kupu,dinosaur:dinosaurus,adventure:petualangan,telescope:teleskop,chocolate:cokelat,vegetable:sayuran,pineapple:nanas,crocodile:buaya,passenger:penumpang,wonderful:luar biasa,knowledge:pengetahuan,important:penting,community:komunitas,restaurant:restoran,calendar:kalender,neighborhood:lingkungan,strawberry:stroberi,playground:taman bermain,celebration:perayaan,temperature:suhu"];
const VOW="aeiouy"; // Y is never hidden: treated as a non-hideable letter for consistency
const isC=c=>/[a-z]/.test(c)&&!VOW.includes(c);
const BANK=[];RAW.forEach((s,lv)=>{const seen={};s.split(",").forEach(p=>{const[w,m]=p.split(":");if(seen[w])return;seen[w]=1;BANK.push({id:lv+"-"+w,w,m,lv})})});
function valid(q){return q.w&&q.m&&q.pos.length>0&&q.pos.length<q.w.length&&q.pos.every(i=>isC(q.w[i]))&&q.ans.join("")===q.pos.map(i=>q.w[i]).join("")&&q.pat.split("").every((c,i)=>q.pos.includes(i)?c==="_":c===q.w[i])}
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function mk(e){const cs=[...e.w].map((c,i)=>isC(c)?i:-1).filter(i=>i>=0);const k=Math.min(cs.length-1,[1,1,1+rnd(2),2,2+rnd(2),3+rnd(2)][e.lv]);
const pos=shuf(cs).slice(0,Math.max(1,k)).sort((a,b)=>a-b);const q={...e,pos,ans:pos.map(i=>e.w[i]),pat:[...e.w].map((c,i)=>pos.includes(i)?"_":c).join("")};
if(e.lv<2){const o=shuf("bcdfghjklmnprstvwz".split("").filter(c=>c!==q.ans[0])).slice(0,3);q.opts=shuf([q.ans[0],...o])}return q}
const OK=BANK.filter(e=>valid(mk(e)));
let S;try{S=JSON.parse(localStorage.getItem("mc1"))}catch(e){}
S=Object.assign({sess:0,ans:0,ok:0,best:0,lv:[0,0,0,0,0,0].map(()=>({a:0,o:0,s:0})),j:{},perfect:0,speed:0,theme:""},S||{});
if(!Array.isArray(S.lv)||S.lv.length!==6)S.lv=[0,0,0,0,0,0].map(()=>({a:0,o:0,s:0}));
const save=()=>{try{localStorage.setItem("mc1",JSON.stringify(S))}catch(e){}};
if(S.theme)document.documentElement.dataset.theme=S.theme;
let view="home",G=null,T=null,confirmReset=false;
const NAV=[["home","🏠","Dashboard"],["learn","📘","Learn Consonants"],["play","🎮","Play"],["timed","⏱️","Timed Challenge"],["progress","📊","Progress"],["journal","📓","Word Journal"],["badges","🏅","Badges"],["settings","⚙️","Settings"],["about","👤","About the Creator"]];
const acc=(o,a)=>a?Math.round(o/a*100)+"%":"—";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(v){clearInterval(T);G=null;view=v;confirmReset=false;document.getElementById("nv").classList.remove("open");draw()}
function badges(){const j=Object.keys(S.j).length;return[["First Word","Answer your first word",S.ans>=1],["Consonant Starter","Answer 10 words",S.ans>=10],["Word Explorer","Learn 25 words",j>=25],["Spelling Star","90%+ accuracy over 30+ answers",S.ans>=30&&S.ok/S.ans>=.9],["Perfect Round","Finish a session with no mistakes",S.perfect>0],["Speed Solver","8+ correct in one timed challenge",S.speed>0],["Summit Climber","Pass the Advanced level (70%+)",S.lv[5].s>0]]}
function nav(){document.getElementById("nv").innerHTML=NAV.map(n=>`<button class="${view===n[0]||(view==="game"&&n[0]===(G&&G.timed?"timed":"play"))?"on":""}" onclick="go('${n[0]}')"><span aria-hidden="true">${n[1]}</span>${n[2]}</button>`).join("")}
function draw(){nav();const m=document.getElementById("m");m.innerHTML=({home,learn,play:()=>pick(false),timed:()=>pick(true),progress,journal,badgesV,settings,about,game,result})[view]();const f=m.querySelector("input.tile");if(f)f.focus();m.scrollTop=0}
function home(){const j=Object.keys(S.j).length,bg=badges().filter(b=>b[2]).length,done=S.lv.filter(l=>l.s>0).length;
return`<h1>Welcome${S.ans?" back":""}!</h1><p>${S.ans?"Keep going. Every word you finish makes your spelling stronger.":"Letters are missing from words. Fill in the consonants. Start with the Starter level."}</p>
<div class="grid">${[["Sessions",S.sess],["Correct answers",S.ok],["Accuracy",acc(S.ok,S.ans)],["Words learned",j],["Best score",S.best],["Levels passed",done+"/6"],["Badges",bg+"/7"]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="row"><button class="btn y" onclick="go('play')">Play now</button><button class="btn alt" onclick="go('learn')">Learn consonants first</button><button class="btn alt" onclick="go('timed')">Timed challenge</button></div>
<p style="color:var(--mut);font-size:14px;margin-top:18px">${OK.length} validated words across 6 levels. Each play hides different consonants. Progress is saved in this browser only and does not sync to other devices.</p>`}
function learn(){const q=mk(BANK.find(e=>e.w==="school"));
return`<h1>Learn Consonants</h1><div class="card"><p>English has 26 letters. <b>A, E, I, O, U</b> are vowels. The rest are <b>consonants</b>: B C D F G H J K L M N P Q R S T V W X Z (and Y, which this game never hides).</p>
<p>In Missing Consonants only consonants disappear. Vowels always stay on the board.</p></div>
<div class="card"><h3>Example: school (sekolah)</h3><div class="word">${[...q.pat].map(c=>`<span class="tile ${c==="_"?"blank":""}">${c==="_"?"?":c}</span>`).join("")}</div><p>Missing: <b>${q.ans.join(", ").toUpperCase()}</b>. The vowels O and O stay visible.</p></div>
<div class="card"><h3>Letter teams</h3><p>Some consonants work together: <b>sh</b> (fish), <b>ch</b> (chair), <b>th</b> (thin), <b>ph</b> (phone), <b>ck</b> (duck), <b>st</b> (star), <b>tr</b> (train).</p><p>Where to look: start (<b>b</b>ook), middle (ta<b>bl</b>e), end (mil<b>k</b>).</p></div>`}
function pick(timed){return`<h1>${timed?"Timed Challenge":"Choose a level"}</h1><p>${timed?"Answer as many words as you can in 60 seconds. Wrong answers score 0, and you can skip.":"10 words per round. Hints show the Indonesian meaning and cost 2 points."}</p>`+LV.map((l,i)=>`<button class="card btn lv" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" onclick="start(${i},${timed})"><span><b>${i+1}. ${l[0]}</b><small>${l[1]}</small></span><span class="chip">${S.lv[i].s?"Passed":"Play"}</span></button>`).join("")}
function start(lv,timed){const pool=shuf(OK.filter(e=>e.lv===lv)).map(mk);G={lv,timed,qs:pool,i:0,score:0,ok:0,n:0,lock:false,hint:false,fb:null,t:60,log:[]};if(timed){T=setInterval(()=>{G.t--;const e=document.getElementById("tm");if(e)e.textContent=G.t+"s";if(G.t<=0)finish()},1000)}view="game";draw()}
function game(){const q=G.qs[G.i%G.qs.length],tot=G.timed?"":" / 10";
const tiles=[...q.w].map((c,i)=>{const k=q.pos.indexOf(i);if(k<0)return`<span class="tile">${c}</span>`;
if(G.lock){const g=G.fb.given[k];return`<span class="tile ${g===c?"ok":"no"}">${c}</span>`}
return q.opts?`<span class="tile blank">?</span>`:`<input class="tile" data-k="${k}" maxlength="1" autocomplete="off" aria-label="Missing consonant ${k+1}" oninput="typed(this)" onkeydown="keyd(event,this)">`}).join("");
return`<div class="row"><b>${LV[G.lv][0]}</b><span>Score <b>${G.score}</b>${G.timed?` · <b id="tm">${G.t}s</b>`:` · Word ${Math.min(G.i+1,10)}${tot}`}</span></div>
<div class="bar" style="margin:8px 0"><i style="width:${G.timed?G.t/60*100:G.i/10*100}%"></i></div>
<div class="card"><p style="text-align:center;margin:0">Fill in ${q.pos.length>1?q.pos.length+" missing consonants":"the missing consonant"}</p><div class="word pop">${tiles}</div>
${G.hint?`<p style="text-align:center">Meaning: <b>${esc(q.m)}</b></p>`:""}
${!G.lock&&q.opts?`<div class="opts">${q.opts.map(o=>`<button class="btn alt" onclick="ans('${o}')">${o}</button>`).join("")}</div>`:""}
${G.lock?`<div class="fb ${G.fb.all?"ok":"no"}" role="status">${G.fb.all?"✓ Excellent! You completed the word.":"✗ Good try! Missing: "+q.ans.join(", ").toUpperCase()}<br><span style="font-weight:500">${q.w.toUpperCase()} = ${esc(q.m)} · +${G.fb.pts} points</span></div>
<div class="row" style="margin-top:12px"><span></span><button class="btn y" id="nx" onclick="next()">Next word</button></div>`
:`<div class="row" style="margin-top:14px"><span><button class="btn alt" onclick="hint()" ${G.hint?"disabled":""}>Hint (−2)</button> ${G.timed?`<button class="btn alt" onclick="next()">Skip</button>`:""}</span>${q.opts?"":`<button class="btn" onclick="sub()">Submit</button>`}</div>`}</div>`}
function typed(e){e.value=e.value.replace(/[^a-z]/gi,"").toLowerCase();if(e.value){const n=e.nextElementSibling;if(n&&n.tagName==="INPUT")n.focus()}}
function keyd(ev,e){if(ev.key==="Enter")sub();if(ev.key==="Backspace"&&!e.value&&e.previousElementSibling&&e.previousElementSibling.tagName==="INPUT")e.previousElementSibling.focus()}
function hint(){if(G.lock||G.hint)return;G.hint=true;const v=[...document.querySelectorAll("input.tile")].map(i=>i.value);draw();document.querySelectorAll("input.tile").forEach((i,k)=>i.value=v[k]||"")}
function sub(){if(G.lock)return;const v=[...document.querySelectorAll("input.tile")].map(i=>i.value.toLowerCase());if(v.some(x=>!x)){document.querySelector("input.tile:invalid,input.tile[value='']");const e=[...document.querySelectorAll("input.tile")].find(i=>!i.value);if(e)e.focus();return}grade(v)}
function ans(l){grade([l])}
function grade(v){if(G.lock)return;const q=G.qs[G.i%G.qs.length];G.lock=true;const c=v.filter((x,k)=>x===q.ans[k]).length,all=c===q.ans.length;
let pts=Math.round(10*c/q.ans.length);if(G.hint)pts=Math.max(0,pts-2);if(!c)pts=0;G.score+=pts;G.n++;if(all)G.ok++;
G.fb={given:v,all,pts};const j=S.j[q.w]||(S.j[q.w]={m:q.m,p:q.pat,r:0,x:0});j.p=q.pat;if(all)j.r++;else j.x++;G.log.push(all);draw();const b=document.getElementById("nx");if(b)b.focus()}
function next(){if(!G.lock&&!G.timed)return;if(!G.lock)G.n=G.n;G.i++;G.lock=false;G.hint=false;G.fb=null;if(!G.timed&&G.i>=10)return finish();draw()}
function finish(){clearInterval(T);if(!G)return;const g=G;S.sess++;S.ans+=g.n;S.ok+=g.ok;S.best=Math.max(S.best,g.score);const L=S.lv[g.lv];L.a+=g.n;L.o+=g.ok;
if(g.n>=5&&g.ok/g.n>=.7)L.s++;if(!g.timed&&g.n===10&&g.ok===10)S.perfect++;if(g.timed&&g.ok>=8)S.speed++;save();view="result";draw()}
function result(){const g=G;return`<h1>${g.timed?"Time's up!":"Round complete!"}</h1><div class="grid"><div class="card stat"><b>${g.score}</b><span>Score</span></div><div class="card stat"><b>${g.ok}/${g.n}</b><span>Correct</span></div><div class="card stat"><b>${acc(g.ok,g.n)}</b><span>Accuracy</span></div></div>
<p>${g.n&&g.ok/g.n>=.7?"Great job! You passed this level.":"Keep practicing. You need 70% accuracy to pass a level."}</p><div class="row"><button class="btn y" onclick="start(${g.lv},${g.timed})">Play again</button><button class="btn alt" onclick="go('${g.timed?"timed":"play"}')">Change level</button><button class="btn alt" onclick="go('home')">Dashboard</button></div>`}
function progress(){const weak=Object.entries(S.j).filter(e=>e[1].x>0).sort((a,b)=>b[1].x-a[1].x).slice(0,8);
return`<h1>Progress</h1>`+LV.map((l,i)=>{const s=S.lv[i];return`<div class="card"><div class="row"><b>${l[0]}</b><span>${s.a?s.o+"/"+s.a+" correct · "+acc(s.o,s.a):"Not played yet"}</span></div><div class="bar" style="margin-top:8px"><i style="width:${s.a?s.o/s.a*100:0}%"></i></div></div>`}).join("")+`<div class="card"><h3>Words to review</h3>${weak.length?weak.map(e=>`<p style="margin:4px 0"><b>${e[0]}</b> (${esc(e[1].m)}): missed ${e[1].x}×</p>`).join(""):"<p>No missed words yet.</p>"}</div>`}
function journal(){const r=Object.entries(S.j).sort();return`<h1>Word Journal</h1>`+(r.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Word</th><th>Last pattern</th><th>Meaning</th><th>Status</th></tr>${r.map(([w,e])=>`<tr><td><b>${w}</b></td><td>${e.p.toUpperCase()}</td><td>${esc(e.m)}</td><td>${e.r>=2?"Mastered":"Learning"}</td></tr>`).join("")}</table></div>`:`<div class="card">Words you play appear here. Start a round to fill your journal.</div>`)}
function badgesV(){return`<h1>Badges</h1><div class="grid">${badges().map(b=>`<div class="card badge ${b[2]?"got":""}"><h3>${b[2]?"🏅":"🔒"} ${b[0]}</h3><span>${b[1]}</span><br><b>${b[2]?"Earned":"Locked"}</b></div>`).join("")}</div>`}
function settings(){return`<h1>Settings</h1><div class="card"><h3>Theme</h3><div class="row" style="justify-content:flex-start"><button class="btn alt" onclick="th('light')">Light</button><button class="btn alt" onclick="th('dark')">Dark</button><button class="btn alt" onclick="th('')">Match device</button></div></div>
